<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="LINS IO Blog - Practical AI tools, workflows, technology, prompts and useful digital insights.">

  <meta name="theme-color" content="#ffffff">

  <title>LINS IO Blog</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #ffffff;
      color: #080b14;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      border-bottom: 1px solid #eeeeee;
      background: rgba(255,255,255,0.96);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1180px;
      margin: auto;
      height: 82px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;

      background: #f4f4f4;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: -0.5px;

      color: #11131a;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      font-size: 15px;
      font-weight: 600;
      color: #555d69;

      transition: 0.2s ease;
    }

    .back-home:hover {
      color: #2864c7;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1180px;
      margin: auto;
      padding: 82px 24px 60px;
    }

    .eyebrow {
      color: #2864c7;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 17px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 72px);
      line-height: 1.02;
      letter-spacing: -3px;
      max-width: 800px;
      margin-bottom: 24px;
    }

    .hero-description {
      max-width: 680px;
      color: #59616e;
      font-size: 20px;
      line-height: 1.65;
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      max-width: 1180px;
      margin: auto;
      padding: 0 24px 38px;

      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 50px;

      border: 1px solid #e4e6e9;
      border-radius: 13px;

      padding: 0 17px;

      outline: none;
      color: #11131a;
      background: #fafafa;

      transition: 0.2s ease;
    }

    .search-box input:focus {
      border-color: #2864c7;
      background: #ffffff;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-btn {
      height: 44px;
      padding: 0 15px;

      border: 1px solid #e5e7ea;
      border-radius: 10px;

      background: #ffffff;
      color: #59616e;

      cursor: pointer;
      font-size: 14px;
      font-weight: 600;

      transition: 0.2s ease;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #080b14;
      color: #ffffff;
      border-color: #080b14;
    }

    /* =========================
       BLOG LIST
    ========================= */

    .blog-section {
      max-width: 1180px;
      margin: auto;
      padding: 10px 24px 90px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .section-heading h2 {
      font-size: 25px;
      letter-spacing: -0.8px;
    }

    .article-count {
      font-size: 14px;
      color: #7b838e;
    }

    .posts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .post-card {
      border: 1px solid #e9eaec;
      border-radius: 18px;

      padding: 27px;

      background: #ffffff;

      transition:
        transform 0.22s ease,
        box-shadow 0.22s ease,
        border-color 0.22s ease;

      display: flex;
      flex-direction: column;
      min-height: 265px;
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: #d9dce1;
      box-shadow: 0 14px 40px rgba(10, 20, 40, 0.07);
    }

    .post-category {
      display: inline-flex;
      width: fit-content;

      padding: 6px 10px;

      border-radius: 7px;

      background: #f3f6fb;
      color: #2864c7;

      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;

      margin-bottom: 17px;
    }

    .post-title {
      font-size: 25px;
      line-height: 1.22;
      letter-spacing: -1px;

      margin-bottom: 12px;
    }

    .post-description {
      color: #626a76;
      font-size: 15px;
      line-height: 1.65;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-bottom {
      margin-top: auto;
      padding-top: 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .post-date {
      color: #8a919b;
      font-size: 13px;
    }

    .read-more {
      color: #11131a;
      font-size: 14px;
      font-weight: 800;

      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .read-more span {
      transition: transform 0.2s ease;
    }

    .post-card:hover .read-more span {
      transform: translateX(4px);
    }

    /* =========================
       STATES
    ========================= */

    .state {
      text-align: center;
      padding: 70px 20px;
      color: #727a85;
      grid-column: 1 / -1;
    }

    .state strong {
      display: block;
      color: #11131a;
      font-size: 20px;
      margin-bottom: 7px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid #eeeeee;
      padding: 35px 24px;
      text-align: center;
      color: #777f89;
      font-size: 14px;
    }

    footer a {
      color: #2864c7;
      font-weight: 600;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 720px) {

      .header-inner {
        height: 72px;
        padding: 0 18px;
      }

      .brand-logo {
        width: 39px;
        height: 39px;
      }

      .brand-name {
        font-size: 19px;
      }

      .back-home {
        font-size: 13px;
      }

      .hero {
        padding: 60px 20px 45px;
      }

      .hero h1 {
        font-size: 47px;
        letter-spacing: -2px;
      }

      .hero-description {
        font-size: 17px;
      }

      .controls {
        padding: 0 20px 30px;
      }

      .blog-section {
        padding: 5px 20px 70px;
      }

      .posts {
        grid-template-columns: 1fr;
      }

      .post-card {
        padding: 23px;
      }

      .post-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>
    <div class="header-inner">

      <a href="/" class="brand">

        <div class="brand-logo">
          LiNS
        </div>

        <div class="brand-name">
          LINS IO
        </div>

      </a>

      <a href="/" class="back-home">
        ← LINS IO
      </a>

    </div>
  </header>


  <!-- =========================
       HERO
  ========================== -->

  <main>

    <section class="hero">

      <div class="eyebrow">
        LINS IO
      </div>

      <h1>
        Ideas that are actually useful.
      </h1>

      <p class="hero-description">
        Practical AI tools, workflows, prompts, technology
        and digital insights designed to help you work,
        learn and build better.
      </p>

    </section>


    <!-- =========================
         SEARCH + CATEGORIES
    ========================== -->

    <section class="controls">

      <div class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="Search articles..."
          autocomplete="off"
        >
      </div>

      <div
        class="categories"
        id="categories">
      </div>

    </section>


    <!-- =========================
         BLOG POSTS
    ========================== -->

    <section class="blog-section">

      <div class="section-heading">

        <h2>
          Latest Articles
        </h2>

        <div
          class="article-count"
          id="articleCount">
          Loading...
        </div>

      </div>

      <div
        class="posts"
        id="posts">

        <div class="state">
          Loading articles...
        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    © 2026 LINS IO.
    <a href="/">
      Back to LINS IO
    </a>

  </footer>


  <script>

    /*
    =====================================================
    GITHUB CONFIGURATION
    =====================================================

    IMPORTANT:

    Replace these two values with your GitHub details.

    Example:

    const GITHUB_OWNER = "linsio";
    const GITHUB_REPO  = "website";

    =====================================================
    */

    const GITHUB_OWNER = "YOUR_GITHUB_USERNAME";
    const GITHUB_REPO  = "YOUR_REPOSITORY_NAME";

    const GITHUB_BRANCH = "main";

    const BLOG_FOLDER = "blog";


    /*
    =====================================================
    DOM
    =====================================================
    */

    const postsContainer =
      document.getElementById("posts");

    const articleCount =
      document.getElementById("articleCount");

    const searchInput =
      document.getElementById("searchInput");

    const categoriesContainer =
      document.getElementById("categories");


    /*
    =====================================================
    DATA
    =====================================================
    */

    let allPosts = [];
    let activeCategory = "All";


    /*
    =====================================================
    LOAD BLOG FILES FROM GITHUB
    =====================================================
    */

    async function loadBlogPosts() {

      try {

        const apiURL =
          `https://api.github.com/repos/` +
          `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${BLOG_FOLDER}` +
          `?ref=${GITHUB_BRANCH}`;

        const response =
          await fetch(apiURL);

        if (!response.ok) {
          throw new Error(
            "Unable to access GitHub repository."
          );
        }

        const files =
          await response.json();


        /*
        Only HTML files.

        index.html is ignored because it is
        the blog listing page itself.
        */

        const htmlFiles =
          files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
          );


        if (htmlFiles.length === 0) {

          showState(
            "No articles yet.",
            "Add your first .html blog post inside the blog folder."
          );

          articleCount.textContent = "0 articles";

          return;
        }


        /*
        Read metadata from every blog HTML file.
        */

        const postPromises =
          htmlFiles.map(file =>
            readPostMetadata(file)
          );


        const posts =
          await Promise.all(postPromises);


        allPosts =
          posts
            .filter(post => post !== null)
            .sort((a, b) =>
              new Date(b.date || 0) -
              new Date(a.date || 0)
            );


        createCategories();

        renderPosts(allPosts);

      }

      catch (error) {

        console.error(error);

        showState(
          "Unable to load articles.",
          "Check the GitHub repository configuration in this file."
        );

        articleCount.textContent = "Error";

      }

    }


    /*
    =====================================================
    READ POST METADATA
    =====================================================
    */

    async function readPostMetadata(file) {

      try {

        const rawURL =
          `https://raw.githubusercontent.com/` +
          `${GITHUB_OWNER}/${GITHUB_REPO}/` +
          `${GITHUB_BRANCH}/${BLOG_FOLDER}/${file.name}`;

        const response =
          await fetch(rawURL);

        if (!response.ok) {
          return null;
        }

        const html =
          await response.text();


        /*
        Parse HTML.
        */

        const parser =
          new DOMParser();

        const documentHTML =
          parser.parseFromString(
            html,
            "text/html"
          );


        /*
        Metadata.
        */

        const title =
          documentHTML
            .querySelector('meta[name="blog-title"]')
            ?.getAttribute("content")
          ||
          documentHTML.title
          ||
          filenameToTitle(file.name);


        const description =
          documentHTML
            .querySelector(
              'meta[name="blog-description"]'
            )
            ?.getAttribute("content")
          ||
          "";


        const date =
          documentHTML
            .querySelector(
              'meta[name="blog-date"]'
            )
            ?.getAttribute("content")
          ||
          "";


        const category =
          documentHTML
            .querySelector(
              'meta[name="blog-category"]'
            )
            ?.getAttribute("content")
          ||
          "AI & Technology";


        return {

          title,
          description,
          date,
          category,

          url:
            `${BLOG_FOLDER}/${file.name}`

        };

      }

      catch (error) {

        console.error(
          "Post error:",
          file.name,
          error
        );

        return null;

      }

    }


    /*
    =====================================================
    FILENAME → TITLE
    =====================================================
    */

    function filenameToTitle(filename) {

      return filename
        .replace(".html", "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char =>
          char.toUpperCase()
        );

    }


    /*
    =====================================================
    CREATE CATEGORIES
    =====================================================
    */

    function createCategories() {

      const categories =
        [
          "All",
          ...new Set(
            allPosts.map(post =>
              post.category
            )
          )
        ];


      categoriesContainer.innerHTML = "";


      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.className =
          "category-btn" +
          (category === "All"
            ? " active"
            : "");

        button.textContent =
          category;

        button.onclick = () => {

          activeCategory =
            category;

          document
            .querySelectorAll(".category-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          filterPosts();

        };

        categoriesContainer.appendChild(button);

      });

    }


    /*
    =====================================================
    SEARCH
    =====================================================
    */

    searchInput.addEventListener(
      "input",
      filterPosts
    );


    function filterPosts() {

      const search =
        searchInput.value
          .toLowerCase()
          .trim();


      const filtered =
        allPosts.filter(post => {

          const matchesCategory =
            activeCategory === "All" ||
            post.category === activeCategory;


          const searchableText =
            `${post.title}
             ${post.description}
             ${post.category}`
              .toLowerCase();


          const matchesSearch =
            !search ||
            searchableText.includes(search);


          return (
            matchesCategory &&
            matchesSearch
          );

        });


      renderPosts(filtered);

    }


    /*
    =====================================================
    RENDER POSTS
    =====================================================
    */

    function renderPosts(posts) {

      postsContainer.innerHTML = "";


      articleCount.textContent =
        `${posts.length} ` +
        `${posts.length === 1
          ? "article"
          : "articles"}`;


      if (posts.length === 0) {

        showState(
          "No articles found.",
          "Try another search or category."
        );

        return;

      }


      posts.forEach((post, index) => {

        const card =
          document.createElement("article");

        card.className =
          "post-card";


        card.innerHTML = `

          <div>

            <div class="post-category">
              ${escapeHTML(post.category)}
            </div>

            <h3 class="post-title">
              ${escapeHTML(post.title)}
            </h3>

            <p class="post-description">
              ${escapeHTML(post.description)}
            </p>

          </div>


          <div class="post-bottom">

            <span class="post-date">
              ${formatDate(post.date)}
            </span>

            <a
              class="read-more"
              href="${post.url}"
            >
              Read More
              <span>→</span>
            </a>

          </div>

        `;


        postsContainer.appendChild(card);

      });

    }


    /*
    =====================================================
    DATE FORMAT
    =====================================================
    */

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }


      const date =
        new Date(dateString);


      if (isNaN(date.getTime())) {
        return dateString;
      }


      return date.toLocaleDateString(
        "en-US",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    }


    /*
    =====================================================
    EMPTY / ERROR STATE
    =====================================================
    */

    function showState(title, text) {

      postsContainer.innerHTML = `

        <div class="state">

          <strong>
            ${escapeHTML(title)}
          </strong>

          <span>
            ${escapeHTML(text)}
          </span>

        </div>

      `;

    }


    /*
    =====================================================
    BASIC HTML ESCAPE
    =====================================================
    */

    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
    =====================================================
    START
    =====================================================
    */

    loadBlogPosts();

  </script>

</body>
  </html>
